name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libssl-dev nasm
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPNTP_BUILD_TESTS=ON -DPNTP_BUILD_BENCH=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ./build/test/pntp_tests
      - name: Bench (quick)
        run: ./build/bench/pntp_bench --benchmark_min_time=0.01
